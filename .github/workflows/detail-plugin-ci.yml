name: Detail page plugin CI

on:
  push:
    branches:
      - feature/detail-page-redesign-plugin
    paths:
      - 'plugins/detail_status/**'
      - 'spec/detail_status_plugin.spec.js'
      - 'spec/detail_episodes_plugin.spec.js'
      - 'spec/visual/**'
      - '.github/workflows/detail-plugin-ci.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'plugins/detail_status/**'
      - 'spec/detail_status_plugin.spec.js'
      - 'spec/detail_episodes_plugin.spec.js'
      - '.github/workflows/detail-plugin-ci.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detail-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-tests:
    name: Plugin and application regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This repository currently has no lockfile. Use npm install,
      # not npm ci, until a lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check standalone plugin syntax
        run: node --check plugins/detail_status/detail_status.js

      - name: Test detail page plugin
        run: npm test -- --run spec/detail_status_plugin.spec.js spec/detail_episodes_plugin.spec.js

  project-regression:
    name: Application regression suite (existing tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run project regression suite
        run: npm test -- --run

  visual-snapshots:
    name: Browser layout smoke test and screenshots
    # Playwright 1.56 supports Ubuntu 24.04, not the runner's Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser test tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render desktop, TV, and mobile episode layout
        run: node spec/visual/capture_episodes.cjs

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lampa-episode-ui-screenshots
          path: artifacts/episode-ui/*.png
          if-no-files-found: warn
          retention-days: 14
