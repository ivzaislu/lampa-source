<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lampa — тест оформления эпизодов</title>
  <link rel="stylesheet" href="../../public/css/app.css">
  <style>
    html, body { margin: 0; min-height: 100%; background: #091316; color: #eef2f4; }
    .visual-fixture {
      box-sizing: border-box; min-height: 100vh; padding: 11vh 0 6vh;
      background:
        radial-gradient(ellipse at 75% 20%, rgba(42,95,106,.5), transparent 60%),
        linear-gradient(150deg, #091316 5%, #172428 80%, #10161b);
    }
    .fixture-intro { margin: 0 2em 2em; max-width: 57em; }
    .fixture-eyebrow { font-size: 1em; color: #88a8b1; letter-spacing: .1em; text-transform: uppercase; }
    .fixture-title { font-size: 2.6em; font-weight: 500; margin: .5em 0; }
    .fixture-subtitle { font-size: 1.12em; color: #aebfc5; }
    .items-line__body > .scroll { width: 100%; display: block; overflow: visible; }
    .items-line__body .scroll__body {
      display: flex; flex-direction: row; align-items: stretch;
      gap: 1em; transform: none !important;
    }
    .items-line__body .scroll__content { width: auto; padding: .5em 2em 1em; }
    .full-episode__img img { opacity: 1; }
    .full-episode__img { overflow: hidden; }
    .fixture-card-image {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background:
        radial-gradient(circle at 66% 40%, rgba(184,150,111,.6), transparent 24%),
        linear-gradient(145deg, #193840 10%, #435453 48%, #1c272d);
    }
    .fixture-card-image--second { background:
      radial-gradient(circle at 40% 24%, rgba(191,161,107,.48), transparent 22%),
      linear-gradient(125deg, #17222a, #526560, #22262d);
    }
    .fixture-note { padding: 1.4em 2em; color: #85969f; font-size: .92em; }
    .full-episode--small .full-episode__img { min-width: 0; }
  </style>
</head>
<body>
  <main class="visual-fixture">
    <div class="fixture-intro">
      <div class="fixture-eyebrow">Lampa · Тест подключаемого плагина</div>
      <h1 class="fixture-title">Страница сериала</h1>
      <div class="fixture-subtitle">Проверка компактного ряда эпизодов, будущей серии и фокуса пульта</div>
    </div>
    <section id="episode-line" class="items-line">
      <div class="items-line__head"><div class="items-line__title">Сезон 2</div></div>
      <div class="items-line__body">
        <div class="scroll scroll--horizontal">
          <div class="scroll__content"><div class="scroll__body">
            <div id="more" class="card-more card-more--first selector">
              <div class="card-more__box"><div class="card-more__title">Ещё</div></div>
            </div>
            <div class="full-episode full-episode--small full-episode--next selector" data-episode="3" data-air="2099-11-08" data-coming="true">
              <div class="full-episode__img"><img alt=""></div>
              <div class="full-episode__body">
                <div class="full-episode__num">3</div>
                <div class="full-episode__name">Взгляд изнутри</div>
                <div class="full-episode__date">8 Ноября</div>
              </div>
            </div>
            <div class="full-episode full-episode--small full-episode--loaded selector focus" data-episode="2" data-air="2020-11-01">
              <div class="full-episode__img"><div class="fixture-card-image"></div><img alt=""></div>
              <div class="full-episode__body">
                <div class="full-episode__num">2</div>
                <div class="full-episode__name">Последний след</div>
                <div class="full-episode__date">1 Ноября</div>
              </div>
            </div>
            <div class="full-episode full-episode--small full-episode--loaded selector" data-episode="1" data-air="2020-10-20">
              <div class="full-episode__img"><div class="fixture-card-image fixture-card-image--second"></div><img alt=""></div>
              <div class="full-episode__body">
                <div class="full-episode__num">1</div>
                <div class="full-episode__name">Новая глава</div>
                <div class="full-episode__date">20 Октября</div>
              </div>
            </div>
          </div></div>
        </div>
      </div>
    </section>
    <div class="fixture-note">Тестовый экран с настоящими классами и CSS Lampa; данные эпизодов условные.</div>
  </main>
</body>
</html>
